name: Rust

on:
  push:
    paths: 
    - "**.rs"
    - "**/Cargo.toml"
    - "**/rust-toolchain.toml"
    - ".github/workflows/rust.yml"
  pull_request:
  workflow_call:

env:
    CARGO_TERM_COLOR: always

jobs:
  skip_check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'

  test:
    needs:
      - skip_check
    if: needs.skip_check.outputs.should_skip != 'true'
    defaults:
      run:
        working-directory: ninja-xtask
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: |
        cargo test

  lint:
    needs:
      - skip_check
    if: needs.skip_check.outputs.should_skip != 'true'
    defaults:
      run:
        working-directory: ninja-xtask
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: clippy
      run: cargo clippy -- --deny warnings

  fmt:
    needs:
      - skip_check
    if: needs.skip_check.outputs.should_skip != 'true'
    defaults:
      run:
        working-directory: ninja-xtask
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: fmt
      run: cargo fmt --check
